name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-safety:
    name: Deployment safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release helpers
        run: |
          deploy/build-source-release.test.sh
          deploy/verify-sub2api-release.test.sh
          infra/sub2api/scripts/verify-overlay_test.sh

  backend-root-tests:
    name: Backend root tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build embedded frontend assets
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run --cwd default build
          bun run --cwd classic build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run root Go tests
        run: |
          find . -name '*.go' \
            -not -path './infra/sub2api/*' \
            -not -path './web/*' \
            -not -path './electron/*' \
            -print | xargs -n1 dirname | sort -u > /tmp/root-go-packages.txt
          xargs go test < /tmp/root-go-packages.txt

  sub2api-backend-tests:
    name: sub2api backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/sub2api/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check sub2api backend manifest
        id: sub2api_backend
        working-directory: .
        run: |
          if [ -f infra/sub2api/backend/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "infra/sub2api/backend/go.mod is absent; skipping sub2api backend tests."
          fi

      - name: Set up Go
        if: ${{ steps.sub2api_backend.outputs.present == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: infra/sub2api/backend/go.mod
          cache-dependency-path: infra/sub2api/backend/go.sum

      - name: Run sub2api Go tests
        if: ${{ steps.sub2api_backend.outputs.present == 'true' }}
        run: go test ./...


  sub2api-frontend-checks:
    name: sub2api frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/sub2api/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check sub2api frontend manifest
        id: sub2api_frontend
        working-directory: .
        run: |
          if [ -f infra/sub2api/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "infra/sub2api/frontend/package.json is absent; skipping sub2api frontend checks."
          fi

      - name: Set up Node.js
        if: ${{ steps.sub2api_frontend.outputs.present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm dependencies
        if: ${{ steps.sub2api_frontend.outputs.present == 'true' }}
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --trust-lockfile

      - name: Typecheck sub2api frontend
        if: ${{ steps.sub2api_frontend.outputs.present == 'true' }}
        run: corepack pnpm run typecheck

      - name: Run sub2api frontend tests
        if: ${{ steps.sub2api_frontend.outputs.present == 'true' }}
        run: corepack pnpm run test:run

      - name: Build sub2api frontend
        if: ${{ steps.sub2api_frontend.outputs.present == 'true' }}
        run: corepack pnpm run build

  web-default-typecheck:
    name: web/default typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck default frontend
        run: bun run --cwd default typecheck

  web-classic-build:
    name: web/classic build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build classic frontend
        run: bun run --cwd classic build
